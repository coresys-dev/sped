[package]
name = "sped-mapping"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mapping engine, profiles and action model for the Speed Editor control surface"

[dependencies]
sped-device = { path = "../device" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
